name: branch-flow

# Enforces the promotion order: dev -> qa -> main.
#
# Work is developed on dev, promoted to qa when the dev cycle is done, and
# promoted to main when qa signs off. Nothing skips a step: a PR straight from
# a feature branch (or from dev) into main would put unvalidated work into
# production and silently strand qa behind main.
#
# Promotion PRs are raised from a prepared `promote/<src>-to-<tgt>` branch
# rather than from dev/qa directly (see promote.yml), so those two names are
# accepted as equivalent to their source branch.
#
# `promote/dev-to-main` is the ONE deliberate exception to "nothing skips a
# step". It is an override, not a hole:
#
#   * It is a single, well-known, promote.yml-generated branch NAME, not a
#     pattern. `dev` itself, and any feature branch, are still rejected into
#     main -- so the only way to produce a passing head is to run promote.yml
#     with target=main, which logs a warning and records who dispatched it.
#   * It still only OPENS a PR. Nothing in the promotion path merges, so a
#     human still reviews and merges every change that reaches main.
#
# Do not widen this list further, and do not turn it into a prefix/glob match
# (`promote/*` would let any hand-made branch called promote/anything into
# main, which is exactly the bypass this file exists to prevent).
#
# `backmerge/main-to-qa` is allowed into qa (see backmerge.yml). That is the
# REVERSE direction and so cannot skip a step -- it carries main back down to
# qa, closing the gap left by a direct commit to main or by a promotion's own
# merge commit. Note there is no equivalent entry for main: nothing is ever
# back-merged INTO main, and `backmerge/main-to-dev` needs no entry because
# PRs into dev are not gated at all.
#
# This is a REQUIRED CHECK on qa and main. It deliberately does not run on PRs
# into dev -- dev is where work lands from anywhere, and that is the point.

on:
  pull_request:
    types: [opened, reopened, synchronize, edited]
    branches: [qa, main]

permissions:
  contents: read

jobs:
  check-direction:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify the PR follows dev -> qa -> main
        env:
          BASE: ${{ github.event.pull_request.base.ref }}
          HEAD: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail

          case "$BASE" in
            qa)   allowed="dev promote/dev-to-qa backmerge/main-to-qa" ;;
            main) allowed="qa promote/qa-to-main promote/dev-to-main" ;;
            *)
              echo "No direction rule for base '$BASE'; nothing to enforce."
              exit 0
              ;;
          esac

          for ok in $allowed; do
            if [ "$HEAD" = "$ok" ]; then
              echo "OK: $HEAD -> $BASE follows the promotion order."
              exit 0
            fi
          done

          echo "::error title=Wrong promotion direction::'$HEAD' -> '$BASE' skips a step."
          echo ""
          echo "  The promotion order is dev -> qa -> main."
          echo "  PRs into '$BASE' may only come from: $allowed"
          echo ""
          echo "  Land this work on dev first, then promote it:"
          echo "    gh workflow run promote.yml -f source=dev   # dev -> qa"
          echo "    gh workflow run promote.yml -f source=qa    # qa  -> main"
          echo ""
          echo "  If this genuinely cannot wait for qa, use the override --"
          echo "  it opens a dev -> main PR (it does not merge):"
          echo "    gh workflow run promote.yml -f source=dev -f target=main"
          exit 1
